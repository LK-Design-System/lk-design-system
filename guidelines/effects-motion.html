<!-- @dsCard group="1 파운데이션 · 스페이싱 & 모션" viewport="700x190" name="모션" subtitle="표준 이징 · 짧은 120/200/320ms · 바운스·패럴럭스 없음. reduced-motion 준수." -->
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--bw-paper); padding: 22px 24px; font-family: var(--font-sans); display: flex; gap: 30px; align-items: center; }
  .curve { display: flex; gap: 18px; }
  .c { display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .box { width: 96px; height: 96px; border: 1px solid var(--bw-border); border-radius: var(--radius-md); background: var(--bw-mist); }
  .nm { font-size: 12px; font-weight: 800; color: var(--bw-ink); }
  .fn { font-size: 11px; font-weight: 600; color: var(--bw-gray); }
  .durs { display: flex; flex-direction: column; gap: 12px; }
  .d { display: flex; align-items: center; gap: 12px; }
  .track { width: 150px; height: 6px; border-radius: 3px; background: var(--bw-border); position: relative; overflow: hidden; }
  .fill { position: absolute; inset: 0 auto 0 0; border-radius: 3px; background: var(--lk-accent-ink); }
  .dl { font-size: 12px; font-weight: 700; color: var(--bw-ink); width: 120px; }
</style>
</head>
<body>
  <div class="curve">
    <div class="c">
      <svg class="box" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M4 96 C 41 96, 22 4, 96 4" fill="none" stroke="var(--lk-accent-ink)" stroke-width="3" stroke-linecap="round"/></svg>
      <span class="nm">standard</span><span class="fn">0.4, 0, 0.2, 1</span>
    </div>
    <div class="c">
      <svg class="box" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M4 96 C 22 96, 4 4, 96 4" fill="none" stroke="var(--bw-ink)" stroke-width="3" stroke-linecap="round"/></svg>
      <span class="nm">emphasized</span><span class="fn">0.2, 0, 0, 1</span>
    </div>
  </div>
  <div class="durs">
    <div class="d"><span class="dl">fast · 120ms</span><div class="track"><div class="fill" style="width:37%"></div></div></div>
    <div class="d"><span class="dl">base · 200ms</span><div class="track"><div class="fill" style="width:62%"></div></div></div>
    <div class="d"><span class="dl">slow · 320ms</span><div class="track"><div class="fill" style="width:100%"></div></div></div>
  </div>
<script id="__om-font-warmup">window.addEventListener("load",function(){if(document.fonts&&document.fonts.load){["400","500","600","700","800"].forEach(function(w){document.fonts.load(w+' 1em "Pretendard JP"',"한글Aa08");});}});</script>
</body>
</html>
