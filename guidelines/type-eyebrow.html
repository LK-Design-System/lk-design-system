<!-- @dsCard group="1 파운데이션 · 타이포그래피" viewport="700x260" name="이브로우 / 오버라인" subtitle="13px · 700 · +1.8 대문자 — 기본은 뮤트 그레이, 시그널·잉크 톤도 사용 가능." -->
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--bw-paper); padding: 26px 24px; font-family: var(--font-sans); }
  .stack { display: flex; flex-direction: column; gap: 22px; }
  .grp { display: flex; flex-direction: column; gap: 8px; }
  .eb { font-size: 13px; font-weight: 700; letter-spacing: 1.8px; text-transform: uppercase; }
  .m { color: var(--label-alternative); }   /* muted — default */
  .s { color: var(--lk-accent-ink); }        /* signal */
  .i { color: var(--label-strong); }         /* ink */
  .ttl { font-size: 26px; font-weight: 800; letter-spacing: -0.8px; color: var(--bw-ink); }
  .tones { display: flex; gap: 26px; flex-wrap: wrap; }
  .tone { display: flex; flex-direction: column; gap: 5px; }
  .tone-lbl { font-size: 11px; color: var(--label-assistive); font-weight: 600; }
  .dark { background: var(--surface-inverse); border-radius: var(--radius-md); padding: 14px 18px; display: inline-flex; gap: 22px; align-self: flex-start; }
  .dark .m { color: rgba(255,255,255,0.60); }
  .dark .s { color: var(--lk-accent); }
</style>
</head>
<body>
<div class="stack">
  <div class="grp">
    <span class="eb m">AI Robot Platform</span>
    <span class="ttl">현장을 지키는 자율주행 AI 로봇</span>
  </div>
  <div class="tones">
    <div class="tone"><span class="tone-lbl">muted · 기본값</span><span class="eb m">Products</span></div>
    <div class="tone"><span class="tone-lbl">signal</span><span class="eb s">Products</span></div>
    <div class="tone"><span class="tone-lbl">ink</span><span class="eb i">Products</span></div>
  </div>
  <div class="dark">
    <div class="tone"><span class="tone-lbl" style="color:rgba(255,255,255,0.5)">on dark · muted</span><span class="eb m">Products</span></div>
    <div class="tone"><span class="tone-lbl" style="color:rgba(255,255,255,0.5)">on dark · signal</span><span class="eb s">Products</span></div>
  </div>
</div>
<div id="__om-theme-toggle" aria-label="theme" style="position:fixed;top:10px;right:10px;z-index:99999;display:inline-flex;gap:2px;background:var(--surface-raised,#fff);border:1px solid var(--border-subtle,#E1E2E4);border-radius:999px;padding:3px;box-shadow:var(--shadow-1,0 1px 4px rgba(0,0,0,.08));font-family:var(--font-sans,sans-serif)"></div>
<script>(function(){var r=document.documentElement,w=document.getElementById("__om-theme-toggle");if(!w)return;var modes=[["light","라이트"],["dark","다크"]];function paint(){var c=r.getAttribute("data-theme")==="dark"?"dark":"light";[].forEach.call(w.children,function(b){var on=b.dataset.m===c;b.style.background=on?"var(--surface-inverse,#0E1329)":"transparent";b.style.color=on?"var(--text-on-inverse,#fff)":"var(--label-alternative,#70737C)";});}modes.forEach(function(o){var b=document.createElement("button");b.type="button";b.textContent=o[1];b.dataset.m=o[0];b.style.cssText="border:0;cursor:pointer;font:600 11px/1 inherit;letter-spacing:.3px;padding:6px 11px;border-radius:999px;background:transparent;color:var(--label-alternative,#70737C)";b.onclick=function(){r.setAttribute("data-theme",o[0]);paint();};w.appendChild(b);});paint();})();</script>
<script id="__om-font-warmup">window.addEventListener("load",function(){if(document.fonts&&document.fonts.load){["400","500","600","700","800"].forEach(function(w){document.fonts.load(w+' 1em "Pretendard JP"',"한글Aa08");});}});</script>
</body>
</html>
