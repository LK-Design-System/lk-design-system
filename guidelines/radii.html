<!-- @dsCard group="1 파운데이션 · 스페이싱 & 모션" viewport="700x170" name="모서리 반경" subtitle="12px 컨트롤 · 16px 입력·카드 · 24px 시트 · 32px 모달 · pill." -->
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--bw-paper); padding: 22px 24px; font-family: var(--font-sans); }
  .row { display: flex; gap: 16px; align-items: flex-end; }
  .sw { display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .box { width: 72px; height: 72px; background: var(--bw-indigo-tint); border: 1px solid var(--bw-border); border-top-left-radius: var(--r); border-top-right-radius: var(--r); }
  .nm { font-size: 11.5px; font-weight: 700; color: var(--bw-ink); }
  .px { font-size: 11px; font-weight: 600; color: var(--bw-gray); }
</style>
</head>
<body>
<div class="row">
  <div class="sw"><div class="box" style="--r:6px"></div><span class="nm">sm</span><span class="px">6 · chip</span></div>
  <div class="sw"><div class="box" style="--r:12px"></div><span class="nm">md</span><span class="px">12 · button</span></div>
  <div class="sw"><div class="box" style="--r:16px"></div><span class="nm">xl / input</span><span class="px">16 · card · input</span></div>
  <div class="sw"><div class="box" style="--r:18px"></div><span class="nm">2xl</span><span class="px">18 · tile</span></div>
  <div class="sw"><div class="box" style="--r:24px"></div><span class="nm">3xl</span><span class="px">24 · sheet</span></div>
  <div class="sw"><div class="box" style="--r:32px"></div><span class="nm">4xl</span><span class="px">32 · modal</span></div>
  <div class="sw"><div class="box" style="--r:999px"></div><span class="nm">pill</span><span class="px">999 · tag</span></div>
</div>
<script id="__om-font-warmup">window.addEventListener("load",function(){if(document.fonts&&document.fonts.load){["400","500","600","700","800"].forEach(function(w){document.fonts.load(w+' 1em "Pretendard JP"',"한글Aa08");});}});</script>
</body>
</html>
