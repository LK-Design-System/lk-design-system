<!-- @dsCard group="1 파운데이션 · 그리드" viewport="900x380" name="그리드 & 브레이크포인트" subtitle="브레이크포인트 · 컨테이너 단계 · 4px 갭 스케일 — 레이아웃 골격." -->
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--bw-paper); padding: 24px 26px; font-family: var(--font-sans); color: var(--label-normal); }
  .lbl { font-size: 11px; font-weight: 800; letter-spacing: 1.8px; text-transform: uppercase; color: var(--label-assistive); margin: 0 0 10px; }
  .grp { margin-bottom: 22px; }
  .bps { display: flex; gap: 10px; flex-wrap: wrap; }
  .bp { display: flex; flex-direction: column; gap: 2px; padding: 10px 16px; border: 1px solid var(--bw-border); border-radius: var(--radius-md); background: var(--bw-white); }
  .bp b { font-size: 14px; font-weight: 800; letter-spacing: -0.2px; }
  .bp span { font-size: 12px; font-weight: 600; color: var(--bw-gray); font-variant-numeric: tabular-nums; }
  .cts { display: flex; gap: 12px; align-items: flex-end; }
  .ct { height: 34px; border-radius: 7px; background: var(--lk-accent-tint); border: 1px solid var(--lk-accent-ink); display: flex; align-items: center; padding: 0 12px; color: var(--lk-accent-ink); font-size: 12px; font-weight: 800; }
  .note { font-size: 12.5px; color: var(--label-alternative); margin-top: 8px; }
  .gaps { display: flex; gap: 14px; align-items: flex-end; }
  .gap { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .gap i { display: block; width: 30px; background: var(--lk-accent-ink); border-radius: 3px; }
  .gap span { font-size: 11px; font-weight: 700; color: var(--bw-gray); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="grp">
  <p class="lbl">Breakpoints · min-width</p>
  <div class="bps">
    <div class="bp"><b>xs</b><span>0</span></div>
    <div class="bp"><b>sm</b><span>768</span></div>
    <div class="bp"><b>md</b><span>992</span></div>
    <div class="bp"><b>lg</b><span>1200</span></div>
    <div class="bp"><b>xl</b><span>1600</span></div>
  </div>
</div>
<div class="grp">
  <p class="lbl">Container · content width</p>
  <div class="cts">
    <div class="ct" style="width:340px">1100 · ≤ lg</div>
    <div class="ct" style="width:440px">1440 · xl</div>
  </div>
  <p class="note">Centered column · <b>20px</b> page margin · <b>12</b> columns · <b>20px</b> gutter.</p>
</div>
<div class="grp" style="margin-bottom:0">
  <p class="lbl">Gap scale · 4px base</p>
  <div class="gaps">
    <div class="gap"><i style="height:var(--gap-3xs)"></i><span>4</span></div>
    <div class="gap"><i style="height:var(--gap-2xs)"></i><span>8</span></div>
    <div class="gap"><i style="height:var(--gap-xs)"></i><span>12</span></div>
    <div class="gap"><i style="height:var(--gap-sm)"></i><span>16</span></div>
    <div class="gap"><i style="height:var(--gap-md)"></i><span>20</span></div>
    <div class="gap"><i style="height:var(--gap-lg)"></i><span>24</span></div>
    <div class="gap"><i style="height:var(--gap-xl)"></i><span>32</span></div>
    <div class="gap"><i style="height:var(--gap-2xl)"></i><span>40</span></div>
    <div class="gap"><i style="height:var(--gap-3xl)"></i><span>48</span></div>
    <div class="gap"><i style="height:var(--gap-4xl)"></i><span>64</span></div>
  </div>
</div>
<script id="__om-font-warmup">window.addEventListener("load",function(){if(document.fonts&&document.fonts.load){["400","500","600","700","800"].forEach(function(w){document.fonts.load(w+' 1em "Pretendard JP"',"한글Aa08");});}});</script>
</body>
</html>
