<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--bw-paper); padding: 26px 24px; font-family: var(--font-sans); }
  .row { display: grid; grid-template-columns: 1fr 120px; gap: 20px; align-items: baseline; padding: 10px 0; border-bottom: 1px solid var(--bw-border); }
  .row:last-child { border-bottom: none; }
  .lbl { font-size: 12px; font-weight: 600; color: var(--bw-gray); font-variant-numeric: tabular-nums; text-align: right; }
</style>
</head>
<body>
  <div class="row"><span style="font-size:19px;line-height:1.7;color:var(--bw-gray-700)">현장 운영을 자동화하는 자율주행 로봇과 센서·관제 플랫폼.</span><span class="lbl">Lead · 19 / 1.7</span></div>
  <div class="row"><span style="font-size:17px;line-height:1.7;color:var(--bw-gray-700)">엘케이로보틱스는 시설관리·보안순찰·산업안전·국방 분야에 적용 가능한 AI 로봇 플랫폼을 제공합니다.</span><span class="lbl">Body · 17 / 1.7</span></div>
  <div class="row"><span style="font-size:15px;line-height:1.6;color:var(--bw-gray)">담당자가 영업일 기준 1일 이내에 연락드리겠습니다.</span><span class="lbl">Small · 15 / 1.6</span></div>
  <div class="row"><span style="font-size:13px;line-height:1.5;color:var(--bw-gray)">Copyright ⓒ 2024–2026 LK ROBOTICS Inc.</span><span class="lbl">Caption · 13</span></div>
<div id="__om-theme-toggle" aria-label="theme" style="position:fixed;top:10px;right:10px;z-index:99999;display:inline-flex;gap:2px;background:var(--surface-raised,#fff);border:1px solid var(--border-subtle,#E1E2E4);border-radius:999px;padding:3px;box-shadow:var(--shadow-1,0 1px 4px rgba(0,0,0,.08));font-family:var(--font-sans,sans-serif)"></div>
<script>(function(){var r=document.documentElement,w=document.getElementById("__om-theme-toggle");if(!w)return;var modes=[["light","라이트"],["dark","다크"]];function paint(){var c=r.getAttribute("data-theme")==="dark"?"dark":"light";[].forEach.call(w.children,function(b){var on=b.dataset.m===c;b.style.background=on?"var(--surface-inverse,#0E1329)":"transparent";b.style.color=on?"var(--text-on-inverse,#fff)":"var(--label-alternative,#70737C)";});}modes.forEach(function(o){var b=document.createElement("button");b.type="button";b.textContent=o[1];b.dataset.m=o[0];b.style.cssText="border:0;cursor:pointer;font:600 11px/1 inherit;letter-spacing:.3px;padding:6px 11px;border-radius:999px;background:transparent;color:var(--label-alternative,#70737C)";b.onclick=function(){r.setAttribute("data-theme",o[0]);paint();};w.appendChild(b);});paint();})();</script>
<script id="__om-font-warmup">window.addEventListener("load",function(){if(document.fonts&&document.fonts.load){["400","500","600","700","800"].forEach(function(w){document.fonts.load(w+' 1em "Pretendard JP"',"한글Aa08");});}});</script>
</body>
</html>
