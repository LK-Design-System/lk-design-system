<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--bw-paper); padding: 22px 24px; font-family: var(--font-sans); }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .ph { position: relative; aspect-ratio: 4 / 3; border-radius: var(--radius-2xl); overflow: hidden; box-shadow: var(--shadow-md); background: #0E1329; }
  .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ph .scrim { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(14,19,41,0) 45%, rgba(14,19,41,0.62) 100%); }
  .cap { position: absolute; left: 14px; bottom: 11px; font-size: 12px; font-weight: 800; letter-spacing: 0.4px; text-transform: uppercase; color: #fff; }
</style>
</head>
<body>
<div class="row">
  <div class="ph"><img src="../assets/products/lkr-cp.webp" alt="" /><div class="scrim"></div><span class="cap">Product</span></div>
  <div class="ph"><img src="../assets/industry/ind-defense-patrol.webp" alt="" /><div class="scrim"></div><span class="cap">On-site</span></div>
  <div class="ph"><img src="../assets/tech/tech-vision.webp" alt="" /><div class="scrim"></div><span class="cap">Technology</span></div>
</div>
<script id="__om-font-warmup">window.addEventListener("load",function(){if(document.fonts&&document.fonts.load){["400","500","600","700","800"].forEach(function(w){document.fonts.load(w+' 1em "Pretendard JP"',"한글Aa08");});}});</script>
</body>
</html>
