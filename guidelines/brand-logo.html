<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--bw-paper); padding: 22px 24px; font-family: var(--font-sans); }
  .grp { margin-bottom: 18px; }
  .lbl { font-size: 11px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: var(--label-assistive); margin-bottom: 8px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .panel { height: 108px; border-radius: var(--radius-xl); display: flex; align-items: center; justify-content: center; }
  .navy { background: #0E1329; }
  .light { background: #FFFFFF; border: 1px solid var(--bw-border); }
  .panel img { display: block; }
  .stacked img { height: 84px; }
  .mark img { height: 58px; }
  .inline img { height: 38px; }
</style>
</head>
<body>
<div class="grp">
  <div class="lbl">Primary · stacked</div>
  <div class="row">
    <div class="panel navy stacked"><img src="../assets/brand/lk-logo-white.svg" alt="LK ROBOTICS stacked, white" /></div>
    <div class="panel light stacked"><img src="../assets/brand/lk-logo-navy.svg" alt="LK ROBOTICS stacked, navy" /></div>
  </div>
</div>
<div class="grp">
  <div class="lbl">Symbol · LK mark (app icon · favicon)</div>
  <div class="row">
    <div class="panel navy mark"><img src="../assets/brand/lk-mark-white.svg" alt="LK mark, white" /></div>
    <div class="panel light mark"><img src="../assets/brand/lk-mark-navy.svg" alt="LK mark, navy" /></div>
  </div>
</div>
<div class="grp">
  <div class="lbl">Inline · LK ROBOTICS (horizontal)</div>
  <div class="row">
    <div class="panel navy inline"><img src="../assets/brand/lk-logo-inline-white.svg" alt="LK ROBOTICS inline, white" /></div>
    <div class="panel light inline"><img src="../assets/brand/lk-logo-inline-navy.svg" alt="LK ROBOTICS inline, navy" /></div>
  </div>
</div>
<script id="__om-font-warmup">window.addEventListener("load",function(){if(document.fonts&&document.fonts.load){["400","500","600","700","800"].forEach(function(w){document.fonts.load(w+' 1em "Pretendard JP"',"한글Aa08");});}});</script>
</body>
</html>
