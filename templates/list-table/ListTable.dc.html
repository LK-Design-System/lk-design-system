<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>


<helmet><script src="./ds-base.js"></script></helmet>
<div style="font-family:var(--font-sans);color:var(--label-normal);padding:22px;min-height:100%;box-sizing:border-box">
  <div style="font-size:10.5px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--label-assistive);font-family:var(--font-mono, ui-monospace, SFMono-Regular, Menlo, monospace);margin:0 0 14px">TEMPLATE · LIST</div>

  <div style="display:flex;gap:10px;align-items:flex-end;margin-bottom:14px;flex-wrap:wrap">
    <div style="flex:1;min-width:220px">
      <x-import component-from-global-scope="LKRoboticsDesignSystem_4f14ff.SearchField" placeholder="로봇·구역 검색" on-change="{{ onQuery }}" hint-size="100%,40px"></x-import>
    </div>
    <x-import component-from-global-scope="LKRoboticsDesignSystem_4f14ff.Select" options="{{ statusOptions }}" value="{{ status }}" on-change="{{ onStatus }}" placeholder="전체 상태" hint-size="150px,40px"></x-import>
    <x-import component-from-global-scope="LKRoboticsDesignSystem_4f14ff.Select" options="{{ zoneOptions }}" placeholder="전체 구역" hint-size="150px,40px"></x-import>
  </div>

  <x-import component-from-global-scope="LKRoboticsDesignSystem_4f14ff.Table" columns="{{ columns }}" rows="{{ rows }}" hint-size="100%,340px"></x-import>

  <div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px;flex-wrap:wrap;gap:8px">
    <span style="font-size:12.5px;color:var(--label-assistive)">{{ countLabel }}</span>
    <x-import component-from-global-scope="LKRoboticsDesignSystem_4f14ff.Pagination" page="{{ page }}" count="{{ count }}" on-change="{{ onPage }}" hint-size="240px,36px"></x-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { q: '', status: '', page: 1 };
  data = [
    { name: 'LKR-T1', zone: '물류동', statusKey: 'online', status: '온라인', tone: 'positive', battery: 82, comm: '방금' },
    { name: 'LKR-T2', zone: '본관', statusKey: 'online', status: '온라인', tone: 'positive', battery: 64, comm: '1분 전' },
    { name: 'LKR-CP', zone: '물류동', statusKey: 'reconnecting', status: '재연결', tone: 'cautionary', battery: 38, comm: '02분 전' },
    { name: 'OMO-01', zone: '주차장', statusKey: 'offline', status: '오프라인', tone: 'negative', battery: 14, comm: '11분 전' },
    { name: 'LKR-T3', zone: '본관', statusKey: 'online', status: '온라인', tone: 'positive', battery: 91, comm: '방금' },
    { name: 'LKR-D1', zone: '물류동', statusKey: 'online', status: '온라인', tone: 'positive', battery: 77, comm: '방금' },
    { name: 'LKR-D2', zone: '주차장', statusKey: 'reconnecting', status: '재연결', tone: 'cautionary', battery: 45, comm: '03분 전' },
    { name: 'OMO-02', zone: '본관', statusKey: 'online', status: '온라인', tone: 'positive', battery: 58, comm: '1분 전' },
    { name: 'LKR-T4', zone: '물류동', statusKey: 'online', status: '온라인', tone: 'positive', battery: 88, comm: '방금' },
    { name: 'LKR-CP2', zone: '주차장', statusKey: 'offline', status: '오프라인', tone: 'negative', battery: 6, comm: '32분 전' },
    { name: 'LKR-D3', zone: '본관', statusKey: 'online', status: '온라인', tone: 'positive', battery: 73, comm: '방금' },
    { name: 'OMO-03', zone: '물류동', statusKey: 'online', status: '온라인', tone: 'positive', battery: 69, comm: '2분 전' },
    { name: 'LKR-T5', zone: '주차장', statusKey: 'reconnecting', status: '재연결', tone: 'cautionary', battery: 41, comm: '04분 전' },
    { name: 'LKR-D4', zone: '본관', statusKey: 'online', status: '온라인', tone: 'positive', battery: 80, comm: '방금' },
  ];
  renderVals() {
    const per = 7;
    const q = this.state.q.trim().toLowerCase();
    const filtered = this.data.filter(r =>
      (!q || (r.name + ' ' + r.zone).toLowerCase().includes(q)) &&
      (!this.state.status || r.statusKey === this.state.status));
    const count = Math.max(1, Math.ceil(filtered.length / per));
    const page = Math.min(this.state.page, count);
    const rows = filtered.slice((page - 1) * per, page * per);
    const NS = window.LKRoboticsDesignSystem_4f14ff || {};
    const SB = NS.StatusBadge;
    const columns = [
      { key: 'name', label: '로봇' },
      { key: 'zone', label: '구역' },
      { key: 'status', label: '상태', render: (r) => SB ? React.createElement(SB, { tone: r.tone }, r.status) : r.status },
      { key: 'battery', label: '배터리', align: 'right', render: (r) => r.battery + '%' },
      { key: 'comm', label: '최근 통신', align: 'right' },
    ];
    return {
      columns, rows, count, page,
      status: this.state.status,
      countLabel: filtered.length + '대 중 ' + rows.length + '대 표시',
      statusOptions: [
        { value: '', label: '전체 상태' },
        { value: 'online', label: '온라인' },
        { value: 'reconnecting', label: '재연결' },
        { value: 'offline', label: '오프라인' },
      ],
      zoneOptions: [
        { value: '', label: '전체 구역' },
        { value: '물류동', label: '물류동' },
        { value: '본관', label: '본관' },
        { value: '주차장', label: '주차장' },
      ],
      onQuery: (v) => { const val = typeof v === 'string' ? v : (v && v.target ? v.target.value : ''); this.setState({ q: val, page: 1 }); },
      onStatus: (v) => this.setState({ status: v, page: 1 }),
      onPage: (p) => this.setState({ page: p }),
    };
  }
}
</script>
</body>
</html>
