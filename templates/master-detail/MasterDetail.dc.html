<!DOCTYPE html>

<head>

</head>
<body>
<x-dc>


<helmet>
<script src="./ds-base.js"></script>
<style>@keyframes lk-dim{0%,100%{opacity:.45}50%{opacity:1}}@media(prefers-reduced-motion:no-preference){.lk-pulse{animation:lk-dim 1.5s ease-in-out infinite}}</style>
</helmet>
<div style="font-family:var(--font-sans);color:var(--label-normal);padding:22px;min-height:100%;box-sizing:border-box">

                    <span style="display:inline-flex;align-items:center;gap:6px;flex-shrink:0">

                </div>

            </div>

        </sc-for>

          <div style="display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--border-subtle)">
            <span style="width:34px;height:34px;border-radius:var(--radius-md);flex-shrink:0;background:var(--fill-normal);display:inline-flex;align-items:center;justify-content:center;color:var(--label-alternative)">{{ sel.iconEl }}</span>
            <div style="flex:1;min-width:0">
              <div style="font-size:16px;font-weight:800;color:var(--label-strong);letter-spacing:-0.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ sel.title }}</div>
              <div style="font-size:12px;color:var(--label-alternative);margin-top:1px">{{ sel.subtitle }}</div>
            </div>
            <span style="display:inline-flex;align-items:center;gap:6px;flex-shrink:0">

                <svg class="lk-pulse" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{ sel.arrowColor }}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="{{ sel.arrowPath }}"></path></svg>
              </sc-if>
              <sc-if value="{{ sel.still }}" hint-placeholder-val="{{ true }}">

              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"></path></svg>
            </button>
          </div>
          <div style="padding:20px 20px 24px">
            <div style="margin-bottom:20px">
              <div style="font-size:10.5px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--label-assistive);font-family:var(--font-mono, ui-monospace, SFMono-Regular, Menlo, monospace);margin:0 0 6px">상태 조건</div>
              <div style="border-bottom:1px solid var(--line-subtle, #F0EEE9)">
                <sc-for list="{{ sel.conditions }}" as="c" hint-placeholder-count="3">
                  <div style="display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line-subtle, #F0EEE9)">
                    <span style="flex:1;min-width:0;font-size:13.5px;font-weight:600;color:var(--label-neutral)">{{ c.name }}</span>
                    <span style="display:inline-flex;align-items:center;gap:8px;flex-shrink:0;white-space:nowrap">
                      <sc-if value="{{ c.arrow }}" hint-placeholder-val="{{ false }}">
                        <svg class="lk-pulse" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{ c.arrowColor }}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="{{ c.arrowPath }}"></path></svg>
                      </sc-if>
                      <sc-if value="{{ c.noArrow }}" hint-placeholder-val="{{ true }}">
                        <x-import component-from-global-scope="LKRoboticsDesignSystem_4f14ff.Icon" name="{{ c.icon }}" size="15" color="{{ c.iconColor }}" hint-size="15px,15px"></x-import>
                      </sc-if>
                      <span style="font-size:13.5px;font-weight:700;color:var(--label-strong);font-variant-numeric:tabular-nums">{{ c.val }}</span>
                    </span>
                  </div>
                </sc-for>
              </div>
            </div>
            <sc-if value="{{ sel.showTelemetry }}" hint-placeholder-val="{{ true }}">
              <div style="margin-bottom:22px">
                <div style="font-size:10.5px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--label-assistive);font-family:var(--font-mono, ui-monospace, SFMono-Regular, Menlo, monospace);margin:0 0 10px">텔레메트리</div>
                <div style="border-bottom:1px solid var(--line-subtle, #F0EEE9)">
                  <sc-for list="{{ sel.telem }}" as="m" hint-placeholder-count="2">
                    <div style="display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line-subtle, #F0EEE9)">
                      <span style="flex:1;min-width:0;font-size:13.5px;font-weight:600;color:var(--label-neutral)">{{ m.label }}</span>
                      <span style="display:inline-flex;align-items:baseline;gap:3px;flex-shrink:0;white-space:nowrap">
                        <span style="font-size:13.5px;font-weight:700;color:var(--label-strong);font-variant-numeric:tabular-nums">{{ m.value }}</span>
                        <span style="font-size:12px;font-weight:600;color:var(--label-alternative)">{{ m.unit }}</span>
                      </span>
                    </div>
                  </sc-for>
                </div>
              </div>
            </sc-if>
            <div>
              <div style="font-size:10.5px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--label-assistive);font-family:var(--font-mono, ui-monospace, SFMono-Regular, Menlo, monospace);margin:0 0 10px">최근 이벤트</div>
              <sc-for list="{{ sel.events }}" as="e" hint-placeholder-count="3">
                <div style="display:flex;gap:11px">
                  <div style="display:flex;flex-direction:column;align-items:center;flex-shrink:0">
                    <svg width="7" height="7" viewBox="0 0 7 7" style="margin-top:4px"><circle cx="3.5" cy="3.5" r="3.5" fill="{{ e.dotColor }}"></circle></svg>
                    <sc-if value="{{ e.showLine }}" hint-placeholder-val="{{ true }}">
                      <span style="width:1px;flex:1;background:var(--line-subtle, #F0EEE9);min-height:20px"></span>
                    </sc-if>
                  </div>
                  <div style="padding-bottom:14px">
                    <div style="font-size:11.5px;color:var(--label-assistive);font-family:var(--font-mono, ui-monospace, SFMono-Regular, Menlo, monospace);font-variant-numeric:tabular-nums">{{ e.t }}</div>
                    <div style="margin-top:2px;font-size:13px;color:var(--label-neutral)">{{ e.d }}</div>
                  </div>
                </div>
              </sc-for>
            </div>
          </div>
        </div>
      </sc-if>
      <sc-if value="{{ noSel }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;align-items:center;justify-content:center;min-height:300px;padding:40px;text-align:center;color:var(--label-assistive);font-size:13.5px;background:var(--surface-raised);border:1px dashed var(--border-subtle);border-radius:var(--radius-xl)">왼쪽에서 항목을 선택하면 세부 상태가 여기 열립니다.</div>
      </sc-if>
    </div>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:980,&quot;height&quot;:680},&quot;showTelemetry&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;상세 패널&quot;}}">
class Component extends DCLogic {
  state = { selId: 'e2', q: '', status: 'all', loc: 'all' };

  items() {
    return [
      { id: 'd1', type: 'door', building: '본관', title: '정문', loc: '본관 1F', state: '잠김', tone: 'neutral' },
      { id: 'd2', type: 'door', building: '본관', title: '후문', loc: '본관 1F', state: '열림', tone: 'neutral' },
      { id: 'd3', type: 'door', building: '물류동', title: '물류동 출입문', loc: '물류동 1F', state: '끊김', tone: 'negative' },
      { id: 'd4', type: 'door', building: '본관', title: '로비 스피드게이트', loc: '본관 1F', state: '정상', tone: 'positive' },
      { id: 'd5', type: 'door', building: '주차장', title: '주차장 차단기', loc: '주차장 B1', state: '정상', tone: 'positive' },
      { id: 'e1', type: 'elev', building: '물류동', title: '화물 EV 1호기', loc: '물류동', state: 'B1', tone: 'signal', moving: true, direction: 'down' },
      { id: 'e2', type: 'elev', building: '물류동', title: '화물 EV 2호기', loc: '물류동', state: '3F', tone: 'signal', moving: true, direction: 'up' },
      { id: 'e3', type: 'elev', building: '물류동', title: '화물 EV 3호기', loc: '물류동', state: '끊김', tone: 'negative' },
      { id: 'e4', type: 'elev', building: '본관', title: '인화 EV', loc: '본관', state: '정지', tone: 'neutral' },
      { id: 'e5', type: 'elev', building: '본관', title: '비상용 EV', loc: '본관', state: '점검', tone: 'cautionary' },
      { id: 'l1', type: 'lift', building: '별관', title: '계단리프트 A', loc: '별관', state: '정지', tone: 'cautionary' },
      { id: 'l2', type: 'lift', building: '별관', title: '계단리프트 B', loc: '별관', state: '운행', tone: 'positive' },
    ];
  }

  icon(type) {
    const h = React.createElement;
    const s = (ch) => h('svg', { width: 16, height: 16, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 1.7, strokeLinecap: 'round', strokeLinejoin: 'round' }, ch);
    if (type === 'door') return s([h('rect', { key: 1, x: 5, y: 11, width: 14, height: 10, rx: 2 }), h('path', { key: 2, d: 'M8 11V7a4 4 0 0 1 8 0v4' })]);
    if (type === 'elev') return s([h('rect', { key: 1, x: 4, y: 3, width: 16, height: 18, rx: 2 }), h('path', { key: 2, d: 'M9.5 10l2.5-2.5 2.5 2.5' }), h('path', { key: 3, d: 'M9.5 14l2.5 2.5 2.5-2.5' })]);
    return s([h('path', { key: 1, d: 'M4 19h4v-4h4v-4h4V7h4' })]);
  }

  detailOf(it) {
    const alert = it.tone === 'negative', check = it.tone === 'cautionary';
    const comm = { tone: alert ? 'negative' : 'positive', name: '통신', val: alert ? '끊김' : '정상', time: alert ? '02분 전' : '방금' };
    if (it.type === 'door') return {
      conditions: [{ tone: 'neutral', name: '개폐 상태', val: it.state, time: '' }, comm, { tone: alert ? 'cautionary' : 'positive', name: '센서', val: alert ? '응답 없음' : '정상', time: alert ? '02분 전' : '방금' }],
      telem: [{ label: '금일 개폐', value: '14', unit: '회' }, { label: '마지막 통신', value: alert ? '02분 전' : '방금', unit: '' }],
      events: [{ t: '12:04', d: alert ? '통신 끊김 감지' : '상태 통신 확인' }, { t: '09:12', d: '원격 잠금 · 관리자' }, { t: '08:30', d: '출근 개방' }],
    };
    if (it.type === 'elev') return {
      conditions: [{ tone: it.moving ? 'signal' : 'neutral', name: '현재 층', val: it.moving ? it.state : (alert ? '—' : '대기'), time: it.moving ? (it.direction === 'up' ? '상승 중' : '하강 중') : '' }, { tone: alert ? 'negative' : 'positive', name: '도어', val: alert ? '미상' : '닫힘', time: '' }, comm],
      telem: alert ? [{ label: '마지막 통신', value: '03분 전', unit: '' }] : [{ label: '속도', value: it.moving ? '0.8' : '0.0', unit: 'm/s' }, { label: '적재율', value: '32', unit: '%' }],
      events: [{ t: '12:03', d: alert ? '통신 끊김 감지' : (it.moving ? (it.state + ' ' + (it.direction === 'up' ? '상승' : '하강') + ' 중') : '대기') }, { t: '12:01', d: '2F 출발' }, { t: '11:58', d: 'B1 적재 완료 320kg' }],
    };
    return {
      conditions: [{ tone: check ? 'cautionary' : 'positive', name: '운행', val: it.state, time: check ? '점검중' : '' }, { tone: 'neutral', name: '위치', val: '하단', time: '' }, comm],
      telem: check ? [{ label: '점검 경과', value: '24', unit: '분' }] : [{ label: '금일 운행', value: '8', unit: '회' }],
      events: [{ t: '11:40', d: check ? '정기 점검 시작 · 기사' : '정상 운행' }, { t: '11:35', d: '운행 정지 요청' }, { t: '어제 18:20', d: '마지막 정상 운행' }],
    };
  }

  renderVals() {
    const TONE = { positive: '#4F765D', cautionary: '#C29A52', negative: '#CF6360', signal: '#4E7CA8', neutral: '#8B8F98' };
    const color = (t) => TONE[t] || TONE.neutral;
    const TYPE = { door: '자동문', elev: '엘리베이터', lift: '계단리프트' };
    const BUILDINGS = ['본관', '물류동', '별관', '주차장'];
    const bucket = (t) => t === 'negative' ? 'alert' : t === 'cautionary' ? 'warn' : 'ok';
    const sev = (t) => t === 'negative' ? 0 : t === 'cautionary' ? 1 : 2;
    const UP = 'M12 19V5M5 12l7-7 7 7', DOWN = 'M12 5v14M19 12l-7 7-7-7';
    const summary = (it) => it.tone === 'negative' ? '통신 끊김 · 응답 없음' : it.tone === 'cautionary' ? '점검중' : (it.moving && it.direction) ? (it.direction === 'up' ? '상승 중' : '하강 중') : (it.loc + ' · 정상');
    const pill = (it) => { const moving = !!(it.moving && it.direction); return { moving, still: !moving, dotColor: color(it.tone), arrowColor: color(it.tone), arrowPath: it.direction === 'up' ? UP : DOWN, state: it.state }; };
    const showTelemetry = this.props.showTelemetry ?? true;
    const all = this.items();
    const q = (this.state.q || '').trim().toLowerCase();
    const flt = all.filter((it) =>
      (this.state.status === 'all' || bucket(it.tone) === this.state.status) &&
      (this.state.loc === 'all' || it.building === this.state.loc) &&
      (q === '' || (it.title + ' ' + it.loc).toLowerCase().includes(q)));
    const selId = this.state.selId;
    const order = ['door', 'elev', 'lift'];
    const groups = order.map((type) => {
      const its = flt.filter((i) => i.type === type).sort((a, b) => sev(a.tone) - sev(b.tone)).map((it) => ({
        title: it.title, summary: summary(it), iconEl: this.icon(it.type),
        selected: selId === it.id, onSelect: () => this.setState({ selId: it.id }), ...pill(it),
      }));
      return { name: TYPE[type], count: its.length, items: its };
    }).filter((g) => g.count > 0);
    const raw = all.find((i) => i.id === selId) || null;
    let sel = null;
    if (raw) {
      const det = this.detailOf(raw);
      sel = {
        title: raw.title, subtitle: TYPE[raw.type] + ' · ' + raw.loc, iconEl: this.icon(raw.type), ...pill(raw),
        conditions: det.conditions.map((c) => { const arrow = !!(raw.moving && raw.direction) && c.name === '현재 층'; return { name: c.name, val: c.val, icon: ({ '개폐 상태': 'lock', '통신': 'signal', '센서': 'eye', '현재 층': 'layers', '도어': 'lock', '운행': 'gauge', '위치': 'location' })[c.name] || 'dot', iconColor: color(c.tone), arrow, noArrow: !arrow, arrowColor: color(raw.tone), arrowPath: raw.direction === 'up' ? UP : DOWN }; }),
        telem: det.telem,
        events: det.events.map((e, i, arr) => ({ t: e.t, d: e.d, dotColor: i === 0 ? '#4E7CA8' : '#CFCBC4', showLine: i < arr.length - 1 })),
        showTelemetry: showTelemetry && det.telem.length > 0,
      };
    }
    return {
      groups, sel, noSel: !sel, empty: groups.length === 0,
      q: this.state.q || '',
      setQ: (e) => this.setState({ q: e.target.value }),
      statusValue: this.state.status, locValue: this.state.loc,
      setStatus: (v) => this.setState({ status: v }), setLoc: (v) => this.setState({ loc: v }),
      statusOptions: [{ value: 'all', label: '전체' }, { value: 'alert', label: '이상' }, { value: 'warn', label: '점검' }, { value: 'ok', label: '정상' }],
      locOptions: [{ value: 'all', label: '전체 위치' }, ...BUILDINGS.map((b) => ({ value: b, label: b }))],
      close: () => this.setState({ selId: null }),
    };
  }
}
</script>
</body>
</html>
