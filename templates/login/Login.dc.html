<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./ds-base.js"></script></helmet>
<div data-screen-label="로그인" style="min-height:100vh;display:flex;flex-wrap:wrap;font-family:var(--font-sans);color:var(--label-normal);background:var(--surface-raised, #FFFFFF)">

  <div style="flex:1 1 340px;min-height:100vh;box-sizing:border-box;display:flex;align-items:center;justify-content:center;padding:48px 32px">
    <div style="width:min(360px, 100%)">
      <div style="display:flex;align-items:center;justify-content:center;gap:14px;margin:0 0 56px">
        <x-import component-from-global-scope="LKRoboticsDesignSystem_4f14ff.Lockup" variant="inline" tone="ink" height="{{ 26 }}" hint-size="202px,26px"></x-import>
        <div style="width:1px;height:26px;background:var(--line-normal, #E1E2E4)"></div>
        <div style="font-size:19px;font-weight:500;letter-spacing:-0.2px;color:var(--label-alternative, #70737C)">관제 콘솔</div>
      </div>


      <sc-if value="{{ showError }}" hint-placeholder-val="{{ false }}">
        <div style="margin:0 0 18px">
          <x-import component-from-global-scope="LKRoboticsDesignSystem_4f14ff.Banner" tone="error" title="로그인에 실패했습니다" hint-size="100%,64px">이메일 또는 비밀번호를 다시 확인해 주세요.</x-import>
        </div>
      </sc-if>

      <div style="display:grid;gap:16px">
        <x-import component-from-global-scope="LKRoboticsDesignSystem_4f14ff.Input" label="이메일" type="email" placeholder="name@company.com" hint-size="100%,74px"></x-import>
        <x-import component-from-global-scope="LKRoboticsDesignSystem_4f14ff.FormField" label="비밀번호" hint-size="100%,78px">
          <x-import component-from-global-scope="LKRoboticsDesignSystem_4f14ff.PasswordInput" placeholder="8자 이상" hint-size="100%,48px"></x-import>
        </x-import>
      </div>

      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin:16px 0 26px">
        <x-import component-from-global-scope="LKRoboticsDesignSystem_4f14ff.Checkbox" label="로그인 상태 유지" hint-size="130px,24px"></x-import>
        <x-import component-from-global-scope="LKRoboticsDesignSystem_4f14ff.TextButton" size="sm" hint-size="96px,24px">비밀번호 재설정</x-import>
      </div>

      <x-import component-from-global-scope="LKRoboticsDesignSystem_4f14ff.Button" variant="{{ ctaVariant }}" size="lg" full="{{ true }}" hint-size="100%,50px">로그인</x-import>

      <sc-if value="{{ showSso }}" hint-placeholder-val="{{ true }}">
        <div style="margin:26px 0 18px">
          <x-import component-from-global-scope="LKRoboticsDesignSystem_4f14ff.Divider" label="또는" hint-size="100%,18px"></x-import>
        </div>
        <div style="display:flex;justify-content:center;gap:14px">
          <sc-if value="{{ showGoogle }}" hint-placeholder-val="{{ true }}">
            <x-import component-from-global-scope="LKRoboticsDesignSystem_4f14ff.SocialButton" provider="google" icon-only="{{ true }}" tone="{{ ssoTone }}" hint-size="48px,48px"></x-import>
          </sc-if>
          <sc-if value="{{ showApple }}" hint-placeholder-val="{{ true }}">
            <x-import component-from-global-scope="LKRoboticsDesignSystem_4f14ff.SocialButton" provider="apple" icon-only="{{ true }}" tone="{{ ssoTone }}" hint-size="48px,48px"></x-import>
          </sc-if>
          <sc-if value="{{ showFacebook }}" hint-placeholder-val="{{ false }}">
            <x-import component-from-global-scope="LKRoboticsDesignSystem_4f14ff.SocialButton" provider="facebook" icon-only="{{ true }}" tone="{{ ssoTone }}" hint-size="48px,48px"></x-import>
          </sc-if>
        </div>
      </sc-if>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;ctaVariant&quot;: {&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;primary&quot;,&quot;dark&quot;,&quot;signal&quot;,&quot;secondary&quot;],&quot;default&quot;:&quot;primary&quot;,&quot;tsType&quot;:&quot;'primary' | 'dark' | 'signal' | 'secondary'&quot;,&quot;section&quot;:&quot;CTA 색상&quot;},
  &quot;showSso&quot;: {&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;소셜 로그인&quot;},
  &quot;ssoTone&quot;: {&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;outline&quot;,&quot;brand&quot;],&quot;default&quot;:&quot;outline&quot;,&quot;tsType&quot;:&quot;'outline' | 'brand'&quot;,&quot;section&quot;:&quot;소셜 로그인&quot;},
  &quot;showGoogle&quot;: {&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;소셜 로그인&quot;},
  &quot;showApple&quot;: {&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;소셜 로그인&quot;},
  &quot;showFacebook&quot;: {&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;소셜 로그인&quot;},
  &quot;showError&quot;: {&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;옵션&quot;}
}">
class Component extends DCLogic {
  renderVals() {
    return {
      showError: this.props.showError ?? false,
      showSso: this.props.showSso ?? true,
      showGoogle: this.props.showGoogle ?? true,
      showApple: this.props.showApple ?? true,
      showFacebook: this.props.showFacebook ?? false,
      ssoTone: this.props.ssoTone ?? 'outline',
      ctaVariant: this.props.ctaVariant ?? 'primary',
    };
  }
}
</script>
</body>
</html>
