name: LDS cross-repository conformance
description: Run the pinned LDS style and package-boundary contract against a sibling consumer repository.

inputs:
  profile:
    description: Contract profile to execute.
    required: true
  root:
    description: Consumer root relative to the caller workspace.
    required: false
    default: .
  storybook-index:
    description: Optional built Storybook index path relative to the consumer root.
    required: false
    default: ""
  require-built-stories:
    description: Fail when no built Storybook index is supplied.
    required: false
    default: "false"

outputs:
  cli:
    description: Absolute conformance CLI path for subsequent caller steps.
    value: ${{ steps.paths.outputs.cli }}
  lds_root:
    description: Absolute root of the pinned LDS action checkout.
    value: ${{ steps.paths.outputs.lds_root }}
  contract_sha256:
    description: SHA-256 of the contract executed by this action.
    value: ${{ steps.paths.outputs.contract_sha256 }}

runs:
  using: composite
  steps:
    - name: Setup contract runtime
      uses: actions/setup-node@v6.4.0
      with:
        node-version: 22.17.1

    - name: Resolve pinned contract paths
      id: paths
      shell: pwsh
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        $ldsRoot = (Resolve-Path (Join-Path $env:ACTION_PATH "../../..")).Path
        $cli = Join-Path $ldsRoot "packages/conformance/src/cli.mjs"
        $contract = Join-Path $ldsRoot "docs/references/package-split/CROSS_REPOSITORY_STYLE_CONTRACT.json"
        "cli=$cli" >> $env:GITHUB_OUTPUT
        "lds_root=$ldsRoot" >> $env:GITHUB_OUTPUT
        "contract_sha256=$((Get-FileHash -Algorithm SHA256 $contract).Hash.ToLowerInvariant())" >> $env:GITHUB_OUTPUT

    - name: Run LDS conformance
      shell: pwsh
      env:
        CONFORMANCE_CLI: ${{ steps.paths.outputs.cli }}
        CONFORMANCE_LDS_ROOT: ${{ steps.paths.outputs.lds_root }}
        CONSUMER_ROOT: ${{ inputs.root }}
        PROFILE: ${{ inputs.profile }}
        STORYBOOK_INDEX: ${{ inputs.storybook-index }}
        REQUIRE_BUILT_STORIES: ${{ inputs.require-built-stories }}
      run: |
        $root = (Resolve-Path (Join-Path $env:GITHUB_WORKSPACE $env:CONSUMER_ROOT)).Path
        $arguments = @(
          $env:CONFORMANCE_CLI,
          "check",
          "--profile", $env:PROFILE,
          "--root", $root,
          "--lds-root", $env:CONFORMANCE_LDS_ROOT
        )
        if (-not [string]::IsNullOrWhiteSpace($env:STORYBOOK_INDEX)) {
          $arguments += @("--storybook-index", $env:STORYBOOK_INDEX)
        }
        if ($env:REQUIRE_BUILT_STORIES -eq "true") {
          $arguments += "--require-built-stories"
        }
        & node @arguments
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
