name: Release immutable package set

on:
  push:
    tags:
      - 'lds-v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable LDS release tag to publish
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: windows-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.LK_PACKAGES_READ_TOKEN || github.token }}

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Setup canonical Node and GitHub Packages
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22.17.1
          registry-url: https://npm.pkg.github.com
          scope: '@lk-design-system'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for browser-backed release checks
        run: npm exec -- playwright install chromium

      - name: Verify tag and package-set identity
        run: npm run check:release-immutability -- --tag

      - name: Verify that every package version is available
        run: node scripts/check-release-package-availability.mjs

      - name: Run release gate
        run: npm run check:fast

      - name: Publish package set in dependency order
        shell: pwsh
        run: |
          npm publish ./packages/core --ignore-scripts
          npm publish ./packages/theme --ignore-scripts
          npm publish ./packages/product --ignore-scripts
