name: Release immutable package set

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable LDS release tag to publish
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'LK-Design-System/lk-design-system'
    runs-on: [self-hosted, linux, x64, lk-lds-release-linux-x64]
    outputs:
      npm_tag: ${{ steps.release_channel.outputs.npm_tag }}
    env:
      NODE_AUTH_TOKEN: ${{ secrets.LK_PACKAGES_READ_TOKEN || github.token }}

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Verify canonical dispatch and immutable source
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          test "$RUNNER_ENVIRONMENT" = self-hosted
          [[ "$RELEASE_TAG" =~ ^lds-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor HEAD origin/main

      - name: Setup canonical Node and GitHub Packages
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22.17.1
          registry-url: https://npm.pkg.github.com
          scope: '@lk-design-system'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for browser-backed release checks
        run: npm exec -- playwright install chromium

      - name: Verify tag and package-set identity
        env:
          GITHUB_REF_NAME: ${{ inputs.release_tag }}
        run: npm run check:release-immutability -- --tag

      - name: Verify current canonical Robotics snapshot
        run: node scripts/update-release-pins.mjs --check --require-current-canonical-snapshot

      - name: Verify package versions are unpublished
        run: node scripts/check-release-package-availability.mjs

      - name: Run release gate
        run: npm run check:fast

      - name: Select npm release channel
        id: release_channel
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          release_npm_tag=latest
          if [[ "$version" == *-* ]]; then release_npm_tag=rc; fi
          echo "RELEASE_NPM_TAG=$release_npm_tag" >> "$GITHUB_ENV"
          echo "npm_tag=$release_npm_tag" >> "$GITHUB_OUTPUT"
          echo "Publishing $version with npm dist-tag $release_npm_tag."

      - name: Publish package set in dependency order
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          npm publish ./packages/core --tag "$RELEASE_NPM_TAG" --ignore-scripts
          npm publish ./packages/theme --tag "$RELEASE_NPM_TAG" --ignore-scripts
          npm publish ./packages/product --tag "$RELEASE_NPM_TAG" --ignore-scripts

  verify-published:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'LK-Design-System/lk-design-system'
    needs: publish
    runs-on: [self-hosted, linux, x64, lk-lds-release-linux-x64]
    permissions:
      contents: read
      packages: read
    env:
      NODE_AUTH_TOKEN: ${{ secrets.LK_PACKAGES_READ_TOKEN || github.token }}
      RELEASE_NPM_TAG: ${{ needs.publish.outputs.npm_tag }}
      LDS_PUBLISHED_RELEASE_ATTEMPTS: 30
      LDS_PUBLISHED_RELEASE_RETRY_DELAY_MS: 5000

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Setup canonical Node and GitHub Packages
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22.17.1
          registry-url: https://npm.pkg.github.com
          scope: '@lk-design-system'

      - name: Verify published package availability and identity
        run: npm run check:published-release
