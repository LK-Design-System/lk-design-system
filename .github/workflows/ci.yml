name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  design-system:
    name: Design system checks
    # Generated artifacts (src/index ordering via Intl, dist, visual-smoke
    # baselines) are produced on Windows, so run checks on Windows to keep them
    # reproducible. Matches the Storybook Pages deploy workflow.
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          # Migration provenance and clean-main baselines verify commit/tag ancestry.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22.17.1
          cache: npm

      - name: Verify canonical runtime
        run: |
          if ((node --version) -ne 'v22.17.1') {
            throw 'Expected Node 22.17.1.'
          }
          if ((npm --version) -ne '10.9.2') {
            throw 'Expected npm 10.9.2.'
          }

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        # The color-contrast and visual-smoke checks launch Chromium explicitly.
        run: npm exec -- playwright install chromium

      - name: Build, typecheck, Storybook, and pack
        # check:ci == check minus check:storybook-ia. The IA audit gate requires
        # per-page human review, which can't run in automated CI; it stays a
        # local/manual curation step (npm run check:storybook-ia). Once Wave 0
        # evidence is tracked, check:pack:baseline-if-present also regenerates
        # and byte-compares the ignored aggregate tarball.
        run: npm run check:ci

      - name: Runtime dependency audit
        run: npm run check:audit

      - name: Isolated packed React consumer matrix
        # This consumes the actual aggregate .tgz generated by check:ci. It is
        # deliberately separate from the repository-source consumer smoke.
        run: npm run check:consumer:matrix -- --platform=windows --require-browser

      - name: Upload Windows package input for Linux consumption
        uses: actions/upload-artifact@v4
        with:
          name: wave0-windows-consumer-input
          if-no-files-found: error
          path: |
            visual-artifacts/package-smoke/pack/*.tgz
            visual-artifacts/wave0-consumer-matrix/windows.json

  consumer-matrix-linux:
    name: Linux packed consumer matrix
    needs: design-system
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22.17.1
          cache: npm

      - name: Verify matrix runtime
        run: |
          test "$(node --version)" = 'v22.17.1'
          test "$(npm --version)" = '10.9.2'

      - name: Install matrix runner dependencies
        run: npm ci

      - name: Download canonical Windows tarball
        uses: actions/download-artifact@v5
        with:
          name: wave0-windows-consumer-input
          path: visual-artifacts/wave0-consumer-matrix/windows-input

      - name: Consume the Windows artifact on Linux
        run: |
          TARBALL="$(find visual-artifacts/wave0-consumer-matrix/windows-input -name '*.tgz' -print -quit)"
          test -n "$TARBALL"
          npm run check:consumer:matrix -- --platform=linux --tarball="$TARBALL"

      - name: Upload Linux consumer report
        uses: actions/upload-artifact@v4
        with:
          name: wave0-linux-consumer-report
          if-no-files-found: error
          path: visual-artifacts/wave0-consumer-matrix/linux.json
