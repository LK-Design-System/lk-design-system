name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      export_dist:
        description: Build on Linux and upload the canonical generated artifacts.
        type: boolean
        default: false
      export_visual_baseline:
        description: Capture and upload the canonical Linux visual baselines.
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

jobs:
  conformance-linux:
    name: Conformance fixtures (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22.17.1

      # Same install the lds-conformance composite action already performs for
      # consumer repositories, for the same reason: the masthead audit parses
      # TSX with the TypeScript compiler, so a bare `node cli.mjs` dies with
      # ERR_MODULE_NOT_FOUND before running a single check. Installing only the
      # conformance package's own locked dependencies keeps this job cheap and
      # reproducible without a workspace install or registry credentials.
      - name: Install pinned contract dependencies
        run: npm ci --ignore-scripts --omit=dev --no-audit --no-fund --prefix packages/conformance

      - name: Verify portable conformance diagnostics
        run: npm run check --prefix packages/conformance

  export-canonical-dist:
    name: Export canonical Linux artifacts
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.export_dist == true || inputs.export_visual_baseline == true) }}
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.LK_PACKAGES_READ_TOKEN || github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22.17.1

      - name: Install dependencies
        run: npm ci

      - name: Generate workspace package sources
        run: npm run generate:workspace-sources

      - name: Build Storybook workspace dependencies
        run: node scripts/build-workspace-packages.mjs --implementation-only

      - name: Install Playwright browser for visual capture
        if: ${{ inputs.export_visual_baseline == true }}
        run: npm exec -- playwright install --with-deps chromium

      - name: Build generated artifacts on the canonical platform
        # Prompt/API changes also invalidate the root component registry. Refresh
        # it before package-doc projection, then export both copies together.
        # Review stamps remain a manual curation step; do not update them here.
        run: |
          npm run build:storybook
          npm run report:storybook-ia
          npm run generate:components
          npm run update:density-coverage
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { readFileSync, writeFileSync } from 'node:fs';
          const baselinePath = 'docs/references/quality/STORYBOOK_GUIDE_DEDUP_BASELINE.json';
          const previous = JSON.parse(readFileSync(baselinePath, 'utf8'));
          execFileSync(process.execPath, ['scripts/check-component-coverage.mjs', '--update-dedup-baseline'], { stdio: 'inherit' });
          const next = JSON.parse(readFileSync(baselinePath, 'utf8'));
          for (const key of Object.keys(previous.ceilings)) {
            assert(next.ceilings[key] <= previous.ceilings[key], 'Export must not loosen guide-dedup ceilings.');
          }
          // Refresh observations and input hashes without changing owner-reviewed thresholds.
          next.ceilings = previous.ceilings;
          writeFileSync(baselinePath, JSON.stringify(next, null, 2) + '\n');
          NODE
          npm run build

      - name: Upload canonical generated artifacts
        if: ${{ inputs.export_dist == true }}
        uses: actions/upload-artifact@v4
        with:
          name: canonical-linux-generated
          path: |
            docs/components
            docs/references/architecture/DENSITY_COVERAGE_CONTRACT.json
            docs/references/quality/STORYBOOK_INFORMATION_ARCHITECTURE_AUDIT.json
            docs/references/quality/STORYBOOK_GUIDE_DEDUP_BASELINE.json
            storybook-static/index.json
            dist
            src
            packages/core/src
            packages/core/tokens
            packages/core/assets
            packages/core/docs
            packages/core/README.md
            packages/core/styles.css
            packages/theme/src
            packages/theme/tokens
            packages/theme/assets
            packages/theme/docs
            packages/theme/README.md
            packages/theme/styles.css
            packages/product/src
            packages/product/tokens
            packages/product/assets
            packages/product/docs
            packages/product/README.md
            packages/product/styles.css
          if-no-files-found: error

      - name: Capture visual baselines on the canonical platform
        if: ${{ inputs.export_visual_baseline == true }}
        # The source inventory step above already built this exact Storybook.
        run: node scripts/capture-visual-smoke.mjs --update-baseline

      - name: Capture expression-profile baselines on the canonical platform
        if: ${{ inputs.export_visual_baseline == true }}
        run: npm run update:expression-profile-visual

      - name: Upload canonical visual baselines
        if: ${{ inputs.export_visual_baseline == true }}
        uses: actions/upload-artifact@v4
        with:
          name: canonical-linux-visual-baselines
          path: |
            visual-baselines/smoke
            visual-baselines/expression-profile
            docs/references/visual/EXPRESSION_PROFILE_MATRIX.json
          if-no-files-found: error

  design-system:
    name: Design system checks
    # Generated artifacts (dist, generated sources, visual-smoke baselines) are
    # produced on Linux, the same platform as the server04 release gate, so run
    # checks on Linux to keep them reproducible. Matches the Storybook Pages
    # deploy workflow.
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.LK_PACKAGES_READ_TOKEN || github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          # Migration provenance and clean-main baselines verify commit/tag ancestry.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22.17.1
          cache: npm

      - name: Verify canonical runtime
        run: |
          test "$(node --version)" = 'v22.17.1' || { echo 'Expected Node 22.17.1.'; exit 1; }
          test "$(npm --version)" = '10.9.2' || { echo 'Expected npm 10.9.2.'; exit 1; }

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        # The color-contrast and visual-smoke checks launch Chromium explicitly.
        run: npm exec -- playwright install --with-deps chromium

      - name: Build, typecheck, and Storybook
        # check:ci == check minus check:storybook-ia. The IA audit gate requires
        # per-page human review, which can't run in automated CI; it stays a
        # local/manual curation step (npm run check:storybook-ia). Immutable
        # Wave 0 evidence is verified separately inside check:fast.
        run: npm run check:ci

      - name: Runtime dependency audit
        run: npm run check:audit

      - name: Build verified workspace package set
        # The canonical npm 10 runner did not forward CLI arguments after `--`,
        # so CI uses fully specified package scripts for artifact handoff.
        run: npm run check:pack:ci

      - name: Consume workspace package set on Linux
        run: npm run check:workspace-consumer:linux

      - name: Consumer toolchain (types and second bundler)
        # check:workspace-consumer covers the runtime dimension (ESM/CJS/SSR/
        # Vite/browser across React 18 and 19). This covers the two axes it does
        # not: TypeScript resolution against our shipped .d.ts with
        # skipLibCheck off, and a webpack build, whose resolution conventions
        # differ from the Vite/esbuild family. See docs/SYSTEM_PARTITION_REFORM_PLAN.md R2.
        run: npm run check:consumer-toolchain

      - name: Upload workspace package set
        uses: actions/upload-artifact@v4
        with:
          name: workspace-package-set-linux
          if-no-files-found: error
          path: |
            visual-artifacts/workspace-package-set/package-set.json
            visual-artifacts/workspace-package-set/tarballs/*.tgz

      - name: Upload Linux workspace consumer report
        uses: actions/upload-artifact@v4
        with:
          name: workspace-consumer-linux-report
          if-no-files-found: error
          path: visual-artifacts/workspace-consumer-matrix/linux.json

  workspace-consumer-windows:
    name: Windows workspace package consumers
    needs: design-system
    runs-on: windows-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.LK_PACKAGES_READ_TOKEN || github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22.17.1
          cache: npm

      - name: Verify matrix runtime
        run: |
          if ((node --version) -ne 'v22.17.1') {
            throw 'Expected Node 22.17.1.'
          }
          if ((npm --version) -ne '10.9.2') {
            throw 'Expected npm 10.9.2.'
          }

      - name: Install dependencies
        run: npm ci

      - name: Download verified Linux package set
        uses: actions/download-artifact@v5
        with:
          name: workspace-package-set-linux
          path: visual-artifacts/workspace-package-set

      - name: Consume the same workspace package set on Windows
        run: npm run check:workspace-consumer:windows

      - name: Upload Windows workspace consumer report
        uses: actions/upload-artifact@v4
        with:
          name: workspace-consumer-windows-report
          if-no-files-found: error
          path: visual-artifacts/workspace-consumer-matrix/windows.json
