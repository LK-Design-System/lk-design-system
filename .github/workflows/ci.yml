name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  design-system:
    name: Design system checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        # The committed lockfile predates the current pnpm and lists hoisted deps
        # on the root importer, so --frozen-lockfile rejects it. Allow pnpm to
        # reconcile it in-CI (not committed) until the lockfile is regenerated.
        run: pnpm install --no-frozen-lockfile

      - name: Install Playwright browsers
        # pnpm does not run dependencies' postinstall scripts, so Playwright's
        # browser download is skipped; the color-contrast and visual-smoke
        # checks launch chromium, so install it explicitly.
        run: pnpm exec playwright install --with-deps chromium

      - name: Build, typecheck, Storybook, and pack
        run: pnpm run check

      - name: Runtime dependency audit
        run: pnpm run check:audit
