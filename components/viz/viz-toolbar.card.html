<!-- @dsCard group="뷰어" viewport="700x460" name="ViewerToolbar" subtitle="ViewerToolbar · ViewerToolbarButton + Popover — 레이어 버튼이 패널을 여는 조합." -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; background: var(--bw-paper); padding: 24px; font-family: var(--font-sans); color: var(--label-normal); }
  .lbl { font-size: 11px; font-weight: 800; letter-spacing: 1.6px; text-transform: uppercase; color: var(--label-assistive); margin: 0 0 12px; }
  .poptitle { font-size: 10.5px; font-weight: 800; letter-spacing: 1.4px; text-transform: uppercase; color: var(--label-assistive); margin: 0 0 12px 2px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="../../_ds_bundle.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel">
  const { ViewerToolbar, ViewerToolbarButton, Popover, Switch, Icon } = window.LKRoboticsDesignSystem_4f14ff;
  const mono = 'var(--font-mono, ui-monospace, SFMono-Regular, Menlo, monospace)';

  function MapPlaceholder({ ly }) {
    return (
      <svg width="320" height="200" viewBox="0 0 320 200" style={{ display: 'block' }}>
        {ly.map && <rect x="20" y="18" width="280" height="164" fill="none" stroke="rgba(255,255,255,0.5)" strokeWidth="2.5" />}
        {ly.map && <path d="M20 110 H120 M120 18 V110 M190 110 V182 M190 140 H300" fill="none" stroke="rgba(255,255,255,0.34)" strokeWidth="2.5" />}
        {ly.path && <polyline points="60,150 60,80 150,80 150,50 250,50" fill="none" stroke="var(--lk-accent)" strokeWidth="2.5" strokeDasharray="6 6" />}
        {ly.robots && <circle cx="60" cy="150" r="6" fill="var(--lk-accent)" />}
        {ly.robots && <circle cx="250" cy="50" r="6" fill="var(--lk-accent)" />}
      </svg>
    );
  }

  function Demo() {
    const [zoom, setZoom] = React.useState(100);
    const [ly, setLy] = React.useState({ map: true, path: true, robots: true });
    const anyOff = !ly.map || !ly.path || !ly.robots;
    const toggle = (k) => setLy((s) => ({ ...s, [k]: !s[k] }));
    return (
      <div>
        <div className="lbl">레이어 버튼 → Popover 패널 (눌러보세요)</div>
        {/* outer wrapper does NOT clip, so the popover panel can extend past the viewport edge */}
        <div style={{ position: 'relative', height: 240, marginBottom: 26 }}>
          {/* inner clips the scaled map only */}
          <div style={{ position: 'absolute', inset: 0, borderRadius: 'var(--radius-lg)', overflow: 'hidden',
            background: 'var(--surface-inverse)', border: '1px solid var(--border-subtle)' }}>
            <div style={{ position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
              <div style={{ transform: 'scale(' + (zoom / 100) + ')', transition: 'transform .18s var(--ease-out, ease)' }}>
                <MapPlaceholder ly={ly} />
              </div>
            </div>
            <div style={{ position: 'absolute', left: 12, bottom: 12, fontFamily: mono, fontSize: 11, fontWeight: 600, letterSpacing: '0.4px',
              color: 'rgba(255,255,255,0.72)', background: 'rgba(6,9,20,0.55)', borderRadius: 6, padding: '4px 9px' }}>
              {zoom}%
            </div>
          </div>
          <ViewerToolbar orientation="horizontal" style={{ position: 'absolute', top: 12, right: 12 }}>
            <ViewerToolbarButton label="확대" onClick={() => setZoom((z) => Math.min(300, z + 25))}><Icon name="plus" size={18} /></ViewerToolbarButton>
            <ViewerToolbarButton label="축소" onClick={() => setZoom((z) => Math.max(50, z - 25))}><Icon name="minus" size={18} /></ViewerToolbarButton>
            <ViewerToolbarButton label="핏" onClick={() => setZoom(100)}><Icon name="home" size={18} /></ViewerToolbarButton>
            <Popover align="right" width={168} trigger={<ViewerToolbarButton label="레이어" active={anyOff}><Icon name="filter" size={18} /></ViewerToolbarButton>}>
              <div className="poptitle" style={{ margin: '0 0 8px 2px' }}>레이어</div>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
                <Switch size="sm" label="맵" checked={ly.map} onChange={() => toggle('map')} />
                <Switch size="sm" label="경로" checked={ly.path} onChange={() => toggle('path')} />
                <Switch size="sm" label="로봇" checked={ly.robots} onChange={() => toggle('robots')} />
              </div>
            </Popover>
          </ViewerToolbar>
        </div>

        <div className="lbl">orientation — horizontal · vertical</div>
        <div style={{ display: 'flex', gap: 26, alignItems: 'flex-start' }}>
          <ViewerToolbar orientation="horizontal">
            <ViewerToolbarButton label="확대"><Icon name="plus" size={18} /></ViewerToolbarButton>
            <ViewerToolbarButton label="축소"><Icon name="minus" size={18} /></ViewerToolbarButton>
            <ViewerToolbarButton label="레이어" active><Icon name="filter" size={18} /></ViewerToolbarButton>
          </ViewerToolbar>
          <ViewerToolbar orientation="vertical">
            <ViewerToolbarButton label="확대"><Icon name="plus" size={18} /></ViewerToolbarButton>
            <ViewerToolbarButton label="축소"><Icon name="minus" size={18} /></ViewerToolbarButton>
            <ViewerToolbarButton label="가시성" active><Icon name="eye" size={18} /></ViewerToolbarButton>
          </ViewerToolbar>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
<div id="__om-theme-toggle" aria-label="theme" style="position:fixed;top:10px;right:10px;z-index:99999;display:inline-flex;gap:2px;background:var(--surface-raised,#fff);border:1px solid var(--border-subtle,#E1E2E4);border-radius:999px;padding:3px;box-shadow:var(--shadow-1,0 1px 4px rgba(0,0,0,.08));font-family:var(--font-sans,sans-serif)"></div>
<script>(function(){var r=document.documentElement,w=document.getElementById("__om-theme-toggle");if(!w)return;var modes=[["light","라이트"],["dark","다크"]];function paint(){var c=r.getAttribute("data-theme")==="dark"?"dark":"light";[].forEach.call(w.children,function(b){var on=b.dataset.m===c;b.style.background=on?"var(--surface-inverse,#0E1329)":"transparent";b.style.color=on?"var(--text-on-inverse,#fff)":"var(--label-alternative,#70737C)";});}modes.forEach(function(o){var b=document.createElement("button");b.type="button";b.textContent=o[1];b.dataset.m=o[0];b.style.cssText="border:0;cursor:pointer;font:600 11px/1 inherit;letter-spacing:.3px;padding:6px 11px;border-radius:999px;background:transparent;color:var(--label-alternative,#70737C)";b.onclick=function(){r.setAttribute("data-theme",o[0]);paint();};w.appendChild(b);});paint();})();</script>
<script id="__om-font-warmup">window.addEventListener("load",function(){if(document.fonts&&document.fonts.load){["400","500","600","700","800"].forEach(function(w){document.fonts.load(w+' 1em "Pretendard JP"',"한글Aa08");});}});</script>
</body>
</html>
