<!-- @dsCard group="3 로보틱스 · 뷰어" viewport="920x800" name="비디오 스트림 타일" subtitle="VideoStreamTile — 플레이어 컨트롤 바, 라이브 카메라 그리드(live·loading·disconnected), aspectRatio." -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; background: var(--bw-paper); padding: 24px; font-family: var(--font-sans); color: var(--label-normal); }
  .lbl { font-size: 11px; font-weight: 800; letter-spacing: 1.6px; text-transform: uppercase; color: var(--label-assistive); margin: 0 0 12px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 28px; }
  .row { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
  .col { flex: 1; min-width: 200px; }
  .pbtn { border: 0; background: transparent; color: #fff; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; padding: 5px; border-radius: 8px; line-height: 0; transition: background .15s ease; }
  .pbtn:hover { background: rgba(255,255,255,0.16); }
  .pscrub { position: relative; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.20); cursor: pointer; transition: height .12s ease; }
  .pscrub:hover { height: 7px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { VideoStreamTile, Icon } = window.LKRoboticsDesignSystem_4f14ff;
  const mono = 'var(--font-mono, ui-monospace, SFMono-Regular, Menlo, monospace)';

  // Striped placeholder standing in for the app-injected iframe/<video> feed.
  function FeedPlaceholder({ children }) {
    return (
      <div style={{
        position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center',
        background: 'repeating-linear-gradient(135deg, rgba(255,255,255,0.06) 0 10px, rgba(255,255,255,0.02) 10px 20px)',
      }}>
        {children != null && <span style={{ fontFamily: mono, fontSize: 11, fontWeight: 600, letterSpacing: '1.2px', textTransform: 'uppercase', color: 'rgba(255,255,255,0.4)' }}>{children}</span>}
      </div>
    );
  }

  // 비디오 플레이어 컨트롤 바 — 하단 스크림 위 재생/스크러버/시간/볼륨/전체화면.
  function PlayerBar({ progress = 0.62, current = '12:04', total = '42:30' }) {
    const [playing, setPlaying] = React.useState(true);
    const [muted, setMuted] = React.useState(false);
    const buffered = 0.8;
    return (
      <div style={{ position: 'absolute', left: 0, right: 0, bottom: 0, padding: '38px 14px 12px',
        background: 'linear-gradient(0deg, rgba(6,9,20,0.88), rgba(6,9,20,0.30) 55%, transparent)' }}>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
          <div className="pscrub">
            <div style={{ position: 'absolute', top: 0, bottom: 0, left: 0, width: (buffered * 100) + '%', borderRadius: 3, background: 'rgba(255,255,255,0.34)' }} />
            <div style={{ position: 'absolute', top: 0, bottom: 0, left: 0, width: (progress * 100) + '%', borderRadius: 3, background: 'var(--lk-accent)' }} />
            <div style={{ position: 'absolute', top: '50%', left: (progress * 100) + '%', width: 13, height: 13, borderRadius: '50%', background: '#fff', transform: 'translate(-50%,-50%)', boxShadow: '0 1px 6px rgba(0,0,0,0.5)' }} />
          </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
            <button className="pbtn" onClick={() => setPlaying((p) => !p)} aria-label={playing ? '일시정지' : '재생'}><Icon name={playing ? 'pause' : 'play'} size={20} /></button>
            <button className="pbtn" onClick={() => setMuted((m) => !m)} aria-label={muted ? '음소거 해제' : '음소거'}><Icon name={muted ? 'volume-x' : 'volume-2'} size={19} /></button>
            <span style={{ marginLeft: 4, fontFamily: mono, fontSize: 12, color: 'rgba(255,255,255,0.9)', fontVariantNumeric: 'tabular-nums', letterSpacing: '0.2px' }}>{current} <span style={{ color: 'rgba(255,255,255,0.5)' }}>/ {total}</span></span>
            <div style={{ flex: 1 }} />
            <span style={{ fontFamily: mono, fontSize: 10.5, fontWeight: 700, letterSpacing: '0.5px', color: 'rgba(255,255,255,0.72)', border: '1px solid rgba(255,255,255,0.3)', borderRadius: 4, padding: '2px 6px' }}>1080p</span>
            <button className="pbtn" aria-label="설정"><Icon name="setting" size={18} /></button>
            <button className="pbtn" aria-label="전체화면"><Icon name="maximize" size={18} /></button>
          </div>
        </div>
      </div>
    );
  }

  function Demo() {
    return (
      <div>
        <div className="lbl">VideoStreamTile — 플레이어 컨트롤 바</div>
        <div style={{ maxWidth: 620, marginBottom: 28 }}>
          <VideoStreamTile label="현장 실사 · 2026-06-30" status="idle">
            <FeedPlaceholder>RECORDED · 1280×720</FeedPlaceholder>
            <PlayerBar />
          </VideoStreamTile>
        </div>

        <div className="lbl">카메라 그리드 — live · loading · disconnected</div>
        <div className="grid">
          <VideoStreamTile label="RGB" status="live"><FeedPlaceholder>RTSP · 1280×720</FeedPlaceholder></VideoStreamTile>
          <VideoStreamTile label="IR" status="loading"><FeedPlaceholder /></VideoStreamTile>
          <VideoStreamTile label="EO-1" status="disconnected"><FeedPlaceholder /></VideoStreamTile>
        </div>

        <div className="lbl">aspectRatio — 나란히 배치할 때 비율 조정</div>
        <div className="row">
          <div className="col" style={{ maxWidth: 300 }}>
            <VideoStreamTile label="THERMAL" status="live" aspectRatio="4 / 3"><FeedPlaceholder>4∶3</FeedPlaceholder></VideoStreamTile>
          </div>
          <div className="col" style={{ flex: '1 1 420px' }}>
            <VideoStreamTile label="PANO" status="live" aspectRatio="21 / 9"><FeedPlaceholder>21∶9 · WIDE</FeedPlaceholder></VideoStreamTile>
          </div>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
<div id="__om-theme-toggle" aria-label="theme" style="position:fixed;top:10px;right:10px;z-index:99999;display:inline-flex;gap:2px;background:var(--surface-raised,#fff);border:1px solid var(--border-subtle,#E1E2E4);border-radius:999px;padding:3px;box-shadow:var(--shadow-1,0 1px 4px rgba(0,0,0,.08));font-family:var(--font-sans,sans-serif)"></div>
<script>(function(){var r=document.documentElement,w=document.getElementById("__om-theme-toggle");if(!w)return;var modes=[["light","라이트"],["dark","다크"]];function paint(){var c=r.getAttribute("data-theme")==="dark"?"dark":"light";[].forEach.call(w.children,function(b){var on=b.dataset.m===c;b.style.background=on?"var(--surface-inverse,#0E1329)":"transparent";b.style.color=on?"var(--text-on-inverse,#fff)":"var(--label-alternative,#70737C)";});}modes.forEach(function(o){var b=document.createElement("button");b.type="button";b.textContent=o[1];b.dataset.m=o[0];b.style.cssText="border:0;cursor:pointer;font:600 11px/1 inherit;letter-spacing:.3px;padding:6px 11px;border-radius:999px;background:transparent;color:var(--label-alternative,#70737C)";b.onclick=function(){r.setAttribute("data-theme",o[0]);paint();};w.appendChild(b);});paint();})();</script>
<script id="__om-font-warmup">window.addEventListener("load",function(){if(document.fonts&&document.fonts.load){["400","500","600","700","800"].forEach(function(w){document.fonts.load(w+' 1em "Pretendard JP"',"한글Aa08");});}});</script>
</body>
</html>
