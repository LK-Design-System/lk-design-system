<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; background: var(--bw-paper); padding: 24px; font-family: var(--font-sans); }
  .lbl { font-size: 11px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase; color: var(--label-assistive); margin: 0 0 12px; }
  .row { display: flex; gap: 20px; align-items: center; margin-bottom: 22px; }
  .g { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .g span { font-size: 12px; font-weight: 600; color: var(--label-alternative); }
  .btn { display: inline-flex; align-items: center; gap: 10px; height: 48px; padding: 0 20px; border-radius: var(--radius-md); border: 1px solid var(--bw-border); background: var(--bw-white); font-size: 15px; font-weight: 700; color: var(--label-normal); }
</style>
</head>
<body>
<div id="root"></div>
<script src="../../_ds_bundle.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel">
  const { BrandLogo } = window.LKRoboticsDesignSystem_4f14ff;
  function Demo() {
    return (
      <div>
        <div className="lbl">Full-colour marks · 40px</div>
        <div className="row">
          <div className="g"><BrandLogo name="apple" size={40} /><span>apple</span></div>
          <div className="g"><BrandLogo name="facebook" size={40} /><span>facebook</span></div>
          <div className="g"><BrandLogo name="google" size={40} /><span>google</span></div>
        </div>
        <div className="lbl">플랫폼 · 소셜 · 40px</div>
        <div className="row">
          <div className="g"><BrandLogo name="github" size={40} /><span>github</span></div>
          <div className="g"><BrandLogo name="huggingface" size={40} /><span>huggingface</span></div>
          <div className="g"><BrandLogo name="linkedin" size={40} /><span>linkedin</span></div>
          <div className="g"><BrandLogo name="x" size={40} /><span>x</span></div>
          <div className="g"><BrandLogo name="youtube" size={40} /><span>youtube</span></div>
        </div>
        <div className="lbl">In a sign-in button</div>
        <div className="row">
          <span className="btn"><BrandLogo name="google" size={20} /> Google로 계속하기</span>
          <span className="btn"><BrandLogo name="apple" size={20} /> Apple로 계속하기</span>
          <span className="btn"><BrandLogo name="github" size={20} /> GitHub로 계속하기</span>
        </div>
        <div className="lbl">다크 서피스 · mono</div>
        <div className="row" style={{ background: 'var(--surface-inverse)', padding: '14px 18px', borderRadius: 'var(--radius-md)', color: 'var(--text-on-inverse)' }}>
          <BrandLogo name="github" size={28} mono />
          <BrandLogo name="huggingface" size={28} mono />
          <BrandLogo name="linkedin" size={28} mono />
          <BrandLogo name="x" size={28} mono />
          <BrandLogo name="youtube" size={28} mono />
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
<div id="__om-theme-toggle" aria-label="theme" style="position:fixed;top:10px;right:10px;z-index:99999;display:inline-flex;gap:2px;background:var(--surface-raised,#fff);border:1px solid var(--border-subtle,#E1E2E4);border-radius:999px;padding:3px;box-shadow:var(--shadow-1,0 1px 4px rgba(0,0,0,.08));font-family:var(--font-sans,sans-serif)"></div>
<script>(function(){var r=document.documentElement,w=document.getElementById("__om-theme-toggle");if(!w)return;var modes=[["light","라이트"],["dark","다크"]];function paint(){var c=r.getAttribute("data-theme")==="dark"?"dark":"light";[].forEach.call(w.children,function(b){var on=b.dataset.m===c;b.style.background=on?"var(--surface-inverse,#0E1329)":"transparent";b.style.color=on?"var(--text-on-inverse,#fff)":"var(--label-alternative,#70737C)";});}modes.forEach(function(o){var b=document.createElement("button");b.type="button";b.textContent=o[1];b.dataset.m=o[0];b.style.cssText="border:0;cursor:pointer;font:600 11px/1 inherit;letter-spacing:.3px;padding:6px 11px;border-radius:999px;background:transparent;color:var(--label-alternative,#70737C)";b.onclick=function(){r.setAttribute("data-theme",o[0]);paint();};w.appendChild(b);});paint();})();</script>
<script id="__om-font-warmup">window.addEventListener("load",function(){if(document.fonts&&document.fonts.load){["400","500","600","700","800"].forEach(function(w){document.fonts.load(w+' 1em "Pretendard JP"',"한글Aa08");});}});</script>
</body>
</html>
