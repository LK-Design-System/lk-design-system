<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; background: var(--bw-paper); padding: 24px; font-family: var(--font-sans); color: var(--label-normal); }
  .pp { padding: 14px; }
  .pp h4 { margin: 0 0 10px; font-size: 12px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: var(--label-assistive); }
  .pp .f { display: flex; justify-content: space-between; font-size: 13px; padding: 7px 0; border-top: 1px solid var(--bw-band); color: var(--label-neutral); }
  .pp .f b { color: var(--label-strong); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div id="root"></div>
<script src="../../_ds_bundle.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel">
  const { CanvasEditorShell, EditorToolbar, HistoryToolbar, Map2DCanvas, Icon } = window.LKRoboticsDesignSystem_4f14ff;
  function Demo() {
    const [tool, setTool] = React.useState('draw');
    const [step, setStep] = React.useState(3);
    const tools = [
      { value: 'select', icon: <Icon name="search" size={18} />, label: '선택' },
      { value: 'draw', icon: <Icon name="plus" size={18} />, label: '그리기' },
      { value: 'zone', icon: <Icon name="square" size={18} />, label: '존' },
      { value: 'point', icon: <Icon name="location" size={18} />, label: '웨이포인트' },
      { value: 'erase', icon: <Icon name="trash" size={18} />, label: '지우기' },
    ];
    const panel = (
      <div className="pp">
        <h4>속성</h4>
        <div className="f"><span>도구</span><b>{tool}</b></div>
        <div className="f"><span>해상도</span><b>0.05 m/px</b></div>
        <div className="f"><span>존</span><b>3</b></div>
        <div className="f"><span>웨이포인트</span><b>12</b></div>
      </div>
    );
    const status = (
      <>
        <span>1200 × 800 px · 0.05 m/px</span>
        <HistoryToolbar canUndo={step > 0} canRedo={step < 5} count={step}
          onUndo={() => setStep((s) => Math.max(0, s - 1))} onRedo={() => setStep((s) => Math.min(5, s + 1))} onReset={() => setStep(0)}
          style={{ marginLeft: 'auto' }} />
      </>
    );
    return (
      <CanvasEditorShell title="지도 편집 — floor_1.pgm" style={{ height: 440 }}
        tools={<EditorToolbar value={tool} onChange={setTool} items={tools} />}
        panel={panel} status={status}>
        <Map2DCanvas style={{ height: '100%', borderRadius: 0, border: 'none' }}>
          <div style={{ width: 280, height: 200, background: 'repeating-linear-gradient(45deg,#c9cfdb,#c9cfdb 8px,#dfe3ec 8px,#dfe3ec 16px)', border: '2px solid #8b93a7', borderRadius: 4, position: 'relative' }}>
            <div style={{ position: 'absolute', left: 40, top: 40, width: 120, height: 80, border: '2px solid var(--lk-accent-ink)', background: 'rgba(14,155,184,0.14)', borderRadius: 4 }} />
            <span style={{ position: 'absolute', left: 180, top: 130, width: 12, height: 12, borderRadius: '50%', background: 'var(--lk-accent-ink)' }} />
          </div>
        </Map2DCanvas>
      </CanvasEditorShell>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
<div id="__om-theme-toggle" aria-label="theme" style="position:fixed;top:10px;right:10px;z-index:99999;display:inline-flex;gap:2px;background:var(--surface-raised,#fff);border:1px solid var(--border-subtle,#E1E2E4);border-radius:999px;padding:3px;box-shadow:var(--shadow-1,0 1px 4px rgba(0,0,0,.08));font-family:var(--font-sans,sans-serif)"></div>
<script>(function(){var r=document.documentElement,w=document.getElementById("__om-theme-toggle");if(!w)return;var modes=[["light","라이트"],["dark","다크"]];function paint(){var c=r.getAttribute("data-theme")==="dark"?"dark":"light";[].forEach.call(w.children,function(b){var on=b.dataset.m===c;b.style.background=on?"var(--surface-inverse,#0E1329)":"transparent";b.style.color=on?"var(--text-on-inverse,#fff)":"var(--label-alternative,#70737C)";});}modes.forEach(function(o){var b=document.createElement("button");b.type="button";b.textContent=o[1];b.dataset.m=o[0];b.style.cssText="border:0;cursor:pointer;font:600 11px/1 inherit;letter-spacing:.3px;padding:6px 11px;border-radius:999px;background:transparent;color:var(--label-alternative,#70737C)";b.onclick=function(){r.setAttribute("data-theme",o[0]);paint();};w.appendChild(b);});paint();})();</script>
<script id="__om-font-warmup">window.addEventListener("load",function(){if(document.fonts&&document.fonts.load){["400","500","600","700","800"].forEach(function(w){document.fonts.load(w+' 1em "Pretendard JP"',"한글Aa08");});}});</script>
</body>
</html>
