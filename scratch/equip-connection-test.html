<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style> body { margin: 0; background: var(--bw-paper); padding: 24px; font-family: var(--font-sans); } .stack { display: flex; flex-direction: column; gap: 12px; max-width: 440px; } </style>
</head>
<body>
<div id="root"></div>
<script src="../_ds_bundle.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script type="text/babel">

const { ConnectionBadge, Icon } = window.LKRoboticsDesignSystem_4f14ff;

const TONE = {
  positive: 'var(--bw-green)',
  cautionary: 'var(--bw-amber)',
  negative: 'var(--bw-red)',
  signal: 'var(--lk-accent-ink)',
  neutral: 'var(--bw-gray)',
};

function useDimKeyframes() {
  React.useEffect(() => {
    if (typeof document === 'undefined' || document.getElementById('lk-equip-dim-kf')) return;
    const el = document.createElement('style');
    el.id = 'lk-equip-dim-kf';
    el.textContent = '@keyframes lk-equip-dim{0%,100%{opacity:1}50%{opacity:.4}}';
    document.head.appendChild(el);
  }, []);
}

/**
 * LK ROBOTICS — EquipmentStatusCard
 * A facility-equipment status card (door / elevator / stair lift) in the LK
 * ledger idiom — a horizontal row that rhymes with RobotStatusCard: leading
 * icon tile + title on the left, its status conditions as a muted text sub-line
 * underneath, and the headline state on the right as a small tone dot + readable
 * ink label (--label-neutral, WCAG-AA). A moving item swaps the dot for a dim
 * direction arrow so the signal is carried once, not twice; a comms state
 * (`connection`) swaps it for ConnectionBadge signal bars — the system's shared
 * connectivity vocabulary. `icon` takes any node.
 */
function EquipmentStatusCard({ icon, title, ringLabel, ringCaption, tone = 'neutral', direction, connection, chips, style, ...rest }) {
  useDimKeyframes();
  const c = TONE[tone] || TONE.neutral;
  const moving = direction != null;
  const hasChips = chips && chips.length > 0;
  return (
    <div
      style={{
        display: 'flex', alignItems: 'center', gap: 14, width: '100%', boxSizing: 'border-box',
        padding: '14px 16px', background: 'var(--surface-raised)', border: '1px solid var(--border-subtle)',
        borderRadius: 'var(--radius-xl)', boxShadow: 'var(--shadow-sm)', fontFamily: 'var(--font-sans)',
        ...style,
      }}
      {...rest}
    >
      {icon != null && (
        <span style={{ width: 38, height: 38, borderRadius: 'var(--radius-md)', flexShrink: 0, background: 'var(--fill-normal)',
          display: 'inline-flex', alignItems: 'center', justifyContent: 'center', color: 'var(--label-alternative)' }}>
          {icon}
        </span>
      )}

      <div style={{ flex: 1, minWidth: 0 }}>
        {title != null && (
          <div style={{ fontSize: 15, fontWeight: 700, color: 'var(--label-strong)', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>
            {title}
          </div>
        )}
        {(hasChips || ringCaption != null) && (
          <div style={{ marginTop: 3, fontSize: 12, fontWeight: 600, color: 'var(--label-alternative)', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>
            {hasChips ? chips.map((ch) => ch.label).join(' · ') : ringCaption}
          </div>
        )}
      </div>

      {ringLabel != null && (
        <span style={{ display: 'inline-flex', alignItems: 'center', gap: 6, flexShrink: 0, whiteSpace: 'nowrap',
          fontSize: 13, fontWeight: 600, letterSpacing: '-0.1px', color: 'var(--label-neutral)', fontVariantNumeric: 'tabular-nums' }}>
          {moving ? (
            <span aria-label={direction === 'up' ? '상승 중' : '하강 중'} style={{ display: 'inline-flex', color: c, animation: 'lk-equip-dim 1.5s var(--ease-in-out) infinite' }}>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.6" strokeLinecap="round" strokeLinejoin="round">
                {direction === 'up' ? <path d="M12 19V5M5 12l7-7 7 7" /> : <path d="M12 5v14M19 12l-7 7-7-7" />}
              </svg>
            </span>
          ) : connection != null ? (
            <ConnectionBadge status={connection} showLabel={false} size="sm" style={{ flexShrink: 0 }} />
          ) : (
            <span style={{ width: 7, height: 7, borderRadius: '50%', background: c, flexShrink: 0 }} />
          )}
          {ringLabel}
        </span>
      )}
    </div>
  );
}

const ElevatorGlyph = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9.5 10l2.5-2.5 2.5 2.5"/><path d="M9.5 14l2.5 2.5 2.5-2.5"/></svg>;
  const StairsGlyph = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round"><path d="M4 19h4v-4h4v-4h4V7h4"/></svg>;
  function Demo() {
    return (
      <div className="stack">
        <EquipmentStatusCard icon={<Icon name="lock" size={16} />} title="정문" ringLabel="연결 끊김" tone="negative" connection="offline"
          chips={[{ label: '센서 응답 없음', tone: 'negative' }, { label: '통신 끊김', tone: 'negative' }]} />
        <EquipmentStatusCard icon={<Icon name="signal" size={16} />} title="옥상 게이트웨이" ringLabel="재연결" connection="reconnecting"
          chips={[{ label: '신호 약함', tone: 'cautionary' }]} />
        <EquipmentStatusCard icon={<ElevatorGlyph />} title="화물 엘리베이터 2호기" ringLabel="3F" ringCaption="이동중" tone="signal" direction="up" />
        <EquipmentStatusCard icon={<StairsGlyph />} title="계단리프트 A" ringLabel="STOP" tone="cautionary" chips={[{ label: '점검중', tone: 'cautionary' }]} />
      </div>
    );
  }
  
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
