<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--bw-paper); padding: 28px; font-family: var(--font-sans); color: var(--label-normal); }
  .lbl { font-size: 11px; font-weight: 800; letter-spacing: 1.6px; text-transform: uppercase; color: var(--label-assistive); margin: 0 0 6px; }
  .note { font-size: 12.5px; color: var(--label-alternative); margin: 0 0 18px; }
  .stack { display: flex; flex-direction: column; gap: 12px; max-width: 460px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel">
const TONE = { positive:'var(--bw-green)', cautionary:'var(--bw-amber)', negative:'var(--bw-red)', signal:'var(--lk-accent-ink)', neutral:'var(--bw-gray)' };
function EquipmentStatusCard({ icon, title, ringLabel, ringCaption, tone='neutral', direction, chips, style, ...rest }) {
  const c = TONE[tone]||TONE.neutral; const moving = direction != null; const hasChips = chips && chips.length>0;
  return (
    <div style={{ display:'flex', alignItems:'center', gap:14, width:'100%', boxSizing:'border-box', padding:'14px 16px', background:'var(--surface-raised)', border:'1px solid var(--border-subtle)', borderRadius:'var(--radius-xl)', boxShadow:'var(--shadow-sm)', fontFamily:'var(--font-sans)', ...style }} {...rest}>
      {icon != null && <span style={{ width:38, height:38, borderRadius:'var(--radius-md)', flexShrink:0, background:'var(--fill-normal)', display:'inline-flex', alignItems:'center', justifyContent:'center', color:'var(--label-alternative)' }}>{icon}</span>}
      <div style={{ flex:1, minWidth:0 }}>
        {title != null && <div style={{ fontSize:15, fontWeight:700, color:'var(--label-strong)', whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{title}</div>}
        {(hasChips || ringCaption != null) && <div style={{ marginTop:3, fontSize:12, fontWeight:600, color:'var(--label-alternative)', whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{hasChips ? chips.map((ch)=>ch.label).join(' · ') : ringCaption}</div>}
      </div>
      {ringLabel != null && (
        <span style={{ display:'inline-flex', alignItems:'center', gap:6, flexShrink:0, padding:'6px 11px', borderRadius:'var(--radius-pill)', background:`color-mix(in srgb, ${c} 12%, var(--surface-card))`, color:c, fontSize:13, fontWeight:800, fontVariantNumeric:'tabular-nums' }}>
          <span style={{ width:7, height:7, borderRadius:'50%', background:c, flexShrink:0 }} />{ringLabel}
          {moving && <span style={{ display:'inline-flex' }}><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">{direction==='up'?<path d="M12 19V5M5 12l7-7 7 7"/>:<path d="M12 5v14M19 12l-7 7-7-7"/>}</svg></span>}
        </span>
      )}
    </div>
  );
}
const Lock = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>;
const Elevator = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9.5 10l2.5-2.5 2.5 2.5"/><path d="M9.5 14l2.5 2.5 2.5-2.5"/></svg>;
const Stairs = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round"><path d="M4 19h4v-4h4v-4h4V7h4"/></svg>;
function Demo(){
  return <div>
    <div className="lbl">EquipmentStatusCard — 적용된 B (가로 원장 + 텍스트 서브라인)</div>
    <div className="note">이게 소스에 실제로 들어간 디자인입니다. 데모 카드(robotics.card.html)는 번들 재컴파일 후 이 모습으로 바뀝니다.</div>
    <div className="stack">
      <EquipmentStatusCard icon={<Lock/>} title="정문" ringLabel="LOCK" tone="negative" chips={[{label:'센서 정상',tone:'positive'},{label:'통신 정상',tone:'positive'}]} />
      <EquipmentStatusCard icon={<Elevator/>} title="화물 엘리베이터 2호기" ringLabel="3F" ringCaption="이동중" tone="signal" direction="up" />
      <EquipmentStatusCard icon={<Stairs/>} title="계단리프트 A" ringLabel="STOP" tone="cautionary" chips={[{label:'점검중',tone:'cautionary'}]} />
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body>
</html>
